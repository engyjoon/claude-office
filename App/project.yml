# Claude Office macOS 앱 프로젝트 (XcodeGen)
#   brew install xcodegen
#   cd App && xcodegen generate   →  ClaudeOffice.xcodeproj 생성 (Git에는 올리지 않음)
name: ClaudeOffice
options:
  bundleIdPrefix: com.engyjoon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  ClaudeOfficeKit:
    path: ..

targets:
  ClaudeOffice:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # 앱 아이콘 (M6(3)). PNG는 scripts/make-app-icon.sh(make icon)로 다시 만듭니다
      - path: Assets.xcassets
    dependencies:
      - package: ClaudeOfficeKit
        product: OfficeCore
      - package: ClaudeOfficeKit
        product: OfficeServer
      - package: ClaudeOfficeKit
        product: OfficeStage
      - sdk: SpriteKit.framework
    info:
      path: Generated/Info.plist
      properties:
        CFBundleName: Claude Office
        CFBundleDisplayName: Claude Office
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Claude Office"
        # 집중 모드 중에는 알림 효과음을 줄이기 위해 집중 모드 상태만 읽습니다 (M5(3))
        NSFocusStatusUsageDescription: "집중 모드 중에는 승인 요청·완료 효과음을 줄이기 위해 집중 모드가 켜져 있는지만 확인해요."
    settings:
      base:
        PRODUCT_NAME: Claude Office
        PRODUCT_BUNDLE_IDENTIFIER: com.engyjoon.claudeoffice
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # 앱 층은 Swift 5 모드로 두어 처음 빌드할 때의 동시성 오류를 줄입니다 (코어 패키지는 Swift 6)
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        # 연회비 없이 본인 맥에서 실행: 로컬 서명(ad-hoc). 샌드박스 없음 (~/.claude를 고쳐야 하므로)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  ClaudeOffice:
    build:
      targets:
        ClaudeOffice: all
    run:
      config: Debug
    archive:
      config: Release
